<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistema Okami & Universo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
  
  <div class="glass-panel" style="width: 100%; max-width: 440px; padding: 36px; background: rgba(30, 41, 59, 0.85); border-color: rgba(255,255,255,0.1); color: #f8fafc;">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #ec4899, #8b5cf6); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 1.8rem;">
        🖨️
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800;">OKAMI & UNIVERSO</h2>
      <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 4px;">Sistema de Gestão de Produção Interna</p>
    </div>

    <div id="login-error" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 20px; text-align: center;"></div>

    <form id="login-form" style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label style="font-size: 0.8rem; font-weight: 700; display: block; margin-bottom: 6px; color: #cbd5e1;">Email do Usuário</label>
        <input type="email" id="email" class="form-control" placeholder="admin@okami.com" required style="background: #0f172a; color: #fff; border-color: #334155;">
      </div>

      <div>
        <label style="font-size: 0.8rem; font-weight: 700; display: block; margin-bottom: 6px; color: #cbd5e1;">Senha</label>
        <input type="password" id="senha" class="form-control" placeholder="••••••••" required style="background: #0f172a; color: #fff; border-color: #334155;">
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top: 8px; padding: 12px; font-size: 0.95rem;">
        Entrar no Sistema ➔
      </button>
    </form>

    <div style="margin-top: 24px; padding: 14px; background: rgba(15, 23, 42, 0.6); border-radius: 10px; font-size: 0.75rem; color: #94a3b8;">
      <div style="font-weight: 700; color: #cbd5e1; margin-bottom: 4px;">Acesso de Demonstração Seed:</div>
      <div>👑 <b>Admin:</b> admin@okami.com | <b>Senha:</b> admin123</div>
      <div>🛠️ <b>Produção:</b> producao@okami.com | <b>Senha:</b> producao123</div>
    </div>

    <div style="margin-top: 14px; padding: 10px 14px; background: rgba(15, 23, 42, 0.4); border: 1px dashed rgba(255,255,255,0.15); border-radius: 10px; font-size: 0.75rem; color: #94a3b8; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
      <span id="api-url-display" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">🔗 API: Carregando...</span>
      <button type="button" onclick="promptChangeApiUrl()" style="background: transparent; border: none; color: #3b82f6; font-weight: 700; cursor: pointer; font-size: 0.75rem; shrink: 0;">⚙️ Alterar URL</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const display = document.getElementById('api-url-display');
      if (display) display.textContent = `🔗 Backend: ${API_URL}`;
    });

    function promptChangeApiUrl() {
      const current = window.OKAMI_API_URL || API_URL;
      const input = prompt('Cole aqui a URL da sua API no Vercel (ex: https://seu-backend.vercel.app/api):', current);
      if (input !== null) {
        setCustomApiUrl(input);
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const errBox = document.getElementById('login-error');
      errBox.style.display = 'none';

      try {
        const res = await apiRequest('/auth/login', {
          method: 'POST',
          body: { email, senha }
        });

        localStorage.setItem('okami_token', res.token);
        localStorage.setItem('okami_user', JSON.stringify(res.usuario));
        window.location.href = 'dashboard.html';
      } catch (err) {
        errBox.textContent = err.message || 'Erro ao fazer login.';
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
