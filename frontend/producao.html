<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produção — Sistema Okami & Universo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="brand-logo">
        <span style="font-size:1.5rem;">🖨️</span>
        <span>OKAMI <span style="opacity: 0.6">&</span> UNIVERSO</span>
        <span class="brand-badge">PRODUÇÃO</span>
      </a>

      <div class="nav-links">
        <a href="dashboard.html" class="nav-btn">📊 Dashboard</a>
        <a href="producao.html" class="nav-btn active">⚙️ Produção</a>
        <a href="historico.html" class="nav-btn">🕒 Histórico</a>
        <a href="usuarios.html" class="nav-btn">👥 Usuários</a>
        <button onclick="toggleTheme()" class="btn btn-secondary" id="theme-toggle-btn" style="padding: 8px 12px;">🌙 Modo Escuro</button>
        <div id="user-info-box" style="display: flex; align-items: center; gap: 10px; margin-left: 8px;"></div>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
      <div>
        <h1 style="font-size: 1.5rem; font-weight: 800;" id="page-title">Fluxo de Produção</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 2px;">Gerenciamento de etapas e pedidos</p>
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="glass-panel" style="display: flex; padding: 4px; border-radius: 12px;">
          <button class="nav-btn active" id="btn-view-kanban" onclick="toggleView('kanban')">📊 Kanban</button>
          <button class="nav-btn" id="btn-view-list" onclick="toggleView('list')">📋 Tabela</button>
        </div>

        <button class="btn btn-secondary" id="btn-toggle-archived" onclick="toggleArchived()">📦 Ver Arquivados</button>
        <button class="btn btn-primary" id="btn-novo-pedido" onclick="openCreateModal()">➕ Novo Pedido</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="toolbar">
      <input type="text" id="filter-busca" class="form-control" placeholder="Buscar por título ou nº do pedido...">
      <select id="filter-loja" class="form-control">
        <option value="">Todas as Lojas</option>
        <option value="Okami">Okami</option>
        <option value="Universo">Universo</option>
      </select>
      <select id="filter-produto" class="form-control">
        <option value="">Todos os Produtos</option>
        <option value="Bloquinho">Bloquinho</option>
        <option value="Caderneta">Caderneta</option>
        <option value="Agenda">Agenda</option>
      </select>
      <select id="filter-status" class="form-control">
        <option value="">Todos os Status</option>
        <option value="Aguardando Impressão">Aguardando Impressão</option>
        <option value="Impresso">Impresso</option>
        <option value="Cortado">Cortado</option>
        <option value="Montado">Montado</option>
        <option value="Pronto">Pronto</option>
        <option value="Enviado">Enviado</option>
      </select>
      <input type="date" id="filter-data" class="form-control">
    </div>

    <!-- Kanban View -->
    <div class="kanban-board" id="kanban-area"></div>

    <!-- List View -->
    <div class="table-responsive" id="table-area" style="display: none;">
      <table class="custom-table">
        <thead>
          <tr>
            <th>Pedido</th>
            <th>Loja</th>
            <th>Produto</th>
            <th>Qtd</th>
            <th>Especificações</th>
            <th>Status</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal Pedido -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 id="modal-title" style="font-weight: 800;">Novo Pedido</h3>
        <button class="btn btn-secondary" onclick="closeModal()" style="padding: 4px 8px;">✖</button>
      </div>

      <form id="order-form" onsubmit="saveOrder(event)" style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
          <div>
            <label style="font-size:0.8rem;font-weight:700;">Nº Pedido *</label>
            <input type="text" id="numero_pedido" name="numero_pedido" class="form-control" required>
          </div>
          <div>
            <label style="font-size:0.8rem;font-weight:700;">Título *</label>
            <input type="text" id="titulo" name="titulo" class="form-control" placeholder="Ex: 20 Bloquinhos Ana" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
          <div>
            <label style="font-size:0.8rem;font-weight:700;">Loja *</label>
            <select id="loja" name="loja" class="form-control">
              <option value="Okami">Okami</option>
              <option value="Universo">Universo</option>
            </select>
          </div>
          <div>
            <label style="font-size:0.8rem;font-weight:700;">Produto *</label>
            <select id="produto" name="produto" class="form-control">
              <option value="Bloquinho">Bloquinho</option>
              <option value="Caderneta">Caderneta</option>
              <option value="Agenda">Agenda</option>
            </select>
          </div>
          <div>
            <label style="font-size:0.8rem;font-weight:700;">Quantidade *</label>
            <input type="number" id="quantidade" name="quantidade" min="1" value="1" class="form-control" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div>
            <label style="font-size:0.8rem;font-weight:700;">Data *</label>
            <input type="date" id="data_pedido" name="data_pedido" class="form-control" required>
          </div>
          <div>
            <label style="font-size:0.8rem;font-weight:700;">Tipo de Espiral *</label>
            <input type="text" id="tipo_espiral" name="tipo_espiral" placeholder="Preto, Transparente..." class="form-control" required>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="frente_verso" name="frente_verso" style="width:18px;height:18px;">
          <label for="frente_verso" style="font-size:0.9rem;font-weight:700;cursor:pointer;">Frente e Verso?</label>
        </div>

        <div>
          <label style="font-size:0.8rem;font-weight:700;">Observações</label>
          <textarea id="observacoes" name="observacoes" class="form-control" rows="2" placeholder="Instruções de corte..."></textarea>
        </div>

        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;border:1px solid var(--border-color);display:flex;flex-direction:column;gap:10px;">
          <div style="font-size:0.85rem;font-weight:800;">Upload de Mídia (JPG, PNG, PDF)</div>
          <div>
            <label style="font-size:0.75rem;font-weight:700;">Arte Frente</label>
            <input type="file" name="arte_frente" accept=".jpg,.jpeg,.png,.pdf" class="form-control">
          </div>
          <div id="field-arte-verso" style="display: none;">
            <label style="font-size:0.75rem;font-weight:700;">Arte Verso</label>
            <input type="file" name="arte_verso" accept=".jpg,.jpeg,.png,.pdf" class="form-control">
          </div>
          <div>
            <label style="font-size:0.75rem;font-weight:700;">Arquivos Extras</label>
            <input type="file" name="arquivos_extras" multiple accept=".jpg,.jpeg,.png,.pdf" class="form-control">
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar Pedido</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/producao.js"></script>
</body>
</html>
