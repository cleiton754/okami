<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários — Sistema Okami & Universo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="brand-logo">
        <span style="font-size:1.5rem;">🖨️</span>
        <span>OKAMI <span style="opacity: 0.6">&</span> UNIVERSO</span>
        <span class="brand-badge">PRODUÇÃO</span>
      </a>

      <div class="nav-links">
        <a href="dashboard.html" class="nav-btn">📊 Dashboard</a>
        <a href="producao.html" class="nav-btn">⚙️ Produção</a>
        <a href="historico.html" class="nav-btn">🕒 Histórico</a>
        <a href="usuarios.html" class="nav-btn active">👥 Usuários</a>
        <button onclick="toggleTheme()" class="btn btn-secondary" id="theme-toggle-btn" style="padding: 8px 12px;">🌙 Modo Escuro</button>
        <div id="user-info-box" style="display: flex; align-items: center; gap: 10px; margin-left: 8px;"></div>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div>
        <h1 style="font-size: 1.5rem; font-weight: 800;">👥 Gestão de Usuários da Equipe</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 2px;">Controle de acesso e operadores</p>
      </div>

      <button class="btn btn-primary" onclick="openCreateUserModal()">👤➕ Novo Usuário</button>
    </div>

    <div class="table-responsive">
      <table class="custom-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Cargo</th>
            <th>Status</th>
            <th>Cadastrado Em</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal Usuario -->
  <div class="modal-overlay" id="user-modal">
    <div class="modal-content" style="max-width: 480px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 id="user-modal-title" style="font-weight: 800;">Novo Usuário</h3>
        <button class="btn btn-secondary" onclick="closeUserModal()" style="padding: 4px 8px;">✖</button>
      </div>

      <form id="user-form" onsubmit="saveUser(event)" style="display: flex; flex-direction: column; gap: 12px;">
        <div>
          <label style="font-size:0.8rem;font-weight:700;">Nome Completo *</label>
          <input type="text" id="user-nome" class="form-control" required>
        </div>

        <div>
          <label style="font-size:0.8rem;font-weight:700;">Email de Acesso *</label>
          <input type="email" id="user-email" class="form-control" required>
        </div>

        <div>
          <label style="font-size:0.8rem;font-weight:700;">Senha *</label>
          <input type="password" id="user-senha" class="form-control">
        </div>

        <div>
          <label style="font-size:0.8rem;font-weight:700;">Cargo / Perfil *</label>
          <select id="user-cargo" class="form-control">
            <option value="producao">Equipe de Produção</option>
            <option value="admin">Administrador Geral</option>
          </select>
        </div>

        <div id="field-user-ativo" style="display: none;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="user-ativo" style="width:18px;height:18px;">
            <label for="user-ativo" style="font-size:0.9rem;font-weight:700;cursor:pointer;">Usuário Ativo?</label>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
          <button type="button" class="btn btn-secondary" onclick="closeUserModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar Usuário</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
