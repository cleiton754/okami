<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico — Sistema Okami & Universo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="brand-logo">
        <span style="font-size:1.5rem;">🖨️</span>
        <span>OKAMI <span style="opacity: 0.6">&</span> UNIVERSO</span>
        <span class="brand-badge">PRODUÇÃO</span>
      </a>

      <div class="nav-links">
        <a href="dashboard.html" class="nav-btn">📊 Dashboard</a>
        <a href="producao.html" class="nav-btn">⚙️ Produção</a>
        <a href="historico.html" class="nav-btn active">🕒 Histórico</a>
        <a href="usuarios.html" class="nav-btn">👥 Usuários</a>
        <button onclick="toggleTheme()" class="btn btn-secondary" id="theme-toggle-btn" style="padding: 8px 12px;">🌙 Modo Escuro</button>
        <div id="user-info-box" style="display: flex; align-items: center; gap: 10px; margin-left: 8px;"></div>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div>
        <h1 style="font-size: 1.5rem; font-weight: 800;">🕒 Histórico de Auditoria & Ações</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 2px;">Registro cronológico de movimentações</p>
      </div>

      <button class="btn btn-secondary" onclick="loadHistory()">🔄 Atualizar Logs</button>
    </div>

    <div class="glass-panel" style="padding: 20px;">
      <div id="history-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/historico.js"></script>
</body>
</html>
